<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms Practice</title>


    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

</head>

<body>
    <main class="main">
        <form class="form">
            <header class="form_header">
                <h1>Bug Report</h1>
                <p>Help us improve by reporting bugs you encounter.</p>
            </header>

            <div class="form_body">
                <div class="form_group" for="bugtitle">
                    <label for="bugtitle">
                        Bug Title
                    </label>
                    <input class="form_input" type="text" id="bugtitle" name="bugtitle" required
                        placeholder="Login button not working on mobile">
                </div>
                <div class="form_group" for="bugdescription">
                    <label for="bugdescription">
                        Description
                    </label>
                    <textarea class="form_textarea" id="bugdescription" name="bugdescription"
                        placeholder="I'm having an issue with the login button on mobile."
                        aria-describedby="hint"></textarea>
                    <p id="hint">Include steps to reproduce expected behavior and what actually happened.</p>
                </div>
            </div>

            <footer class="form_footer">
                <button class="button secondary" type="reset">
                    Reset
                </button>
                <button class="button primary" type="submit">
                    Submit
                </button>
            </footer>
        </form>

        <form class="form">
            <header class="form_header">
                <h1>Bug Report</h1>
                <p>Help us improve by reporting bugs you encounter.</p>
            </header>

            <div class="form_body">
                <div for="bugtitle">
                    <label for="bugtitle">
                        Bug Title
                    </label>
                    <input type="text" id="bugtitle" name="bugtitle" required>
                </div>
                <div for="bugdescription">
                    <label for="bugdescription">
                        Description
                    </label>
                    <textarea type="text" id="bugdescription" name="bugdescription" aria-describedby="hint">
                    </textarea
                    id="hint">
                    <p>Include steps to reproduce expected behavior and what actually happened.</p>
                </div>
            </div>

            <footer class="form_footer">
                <button type="reset">
                    Reset
                </button>
                <button type="submit">
                    Submit
                </button>
            </footer>
            
        </form>
    </main>
</body>

</html>
